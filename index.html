:root{

}
@media (prefers-color-scheme: dark){

}
:root[data-theme="dark"]{

}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:400 19px/1.6 var(--text);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));

}
button,textarea{font-family:inherit}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding-top:16px;padding-bottom:28px}

/* 標題列 */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}

.count{font:400 20px/1 var(--display);background:var(--surface);border:3px solid var(--line);border-radius:999px;padding:10px 18px;white-space:nowrap}

/* 主體 */
.book{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:34px;align-items:start}
.left,.ask{min-width:0}
.stage{border-radius:22px;overflow:hidden;border:3px solid var(--line);background:var(--surface);aspect-ratio:5/3;filter:var(--scene-filter)}
.stage svg{display:block;width:100%;height:100%}
.fxline{min-height:2em;margin:10px 4px 0;font-size:17px;color:var(--muted)}
.fxline b{font-weight:500;color:var(--fg)}
.story{margin-top:6px;background:var(--surface);border:3px solid var(--line);border-radius:22px;padding:22px 24px}
.story p{margin:0;font:400 clamp(23px,2.7vw,28px)/1.8 var(--display);letter-spacing:.03em;text-wrap:pretty}

/* 按鈕 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 24px;border-radius:999px;border:3px solid var(--line);background:var(--surface-2);color:var(--fg);font-size:20px;font-weight:500;cursor:pointer}
.btn svg{width:26px;height:26px;flex:none}
.btn:hover:not(:disabled){border-color:var(--fg)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--lv);border-color:var(--lv);color:var(--on-lv)}
.btn.primary:hover:not(:disabled){border-color:var(--fg)}
.btn.on{background:var(--l2);border-color:var(--l2);color:var(--on-l2)}

/* 提問泡泡 */
.bubble{position:relative;--lv:var(--l1);--on-lv:var(--on-l1);background:var(--surface);border:4px solid var(--lv);border-radius:28px;padding:22px 22px 24px;display:flex;flex-direction:column;gap:16px}
.bubble::before{content:"";position:absolute;left:-15px;top:46px;width:26px;height:26px;background:var(--surface);border-left:4px solid var(--lv);border-bottom:4px solid var(--lv);transform:rotate(45deg)}
.bubble h2{margin:0;font:400 22px/1.3 var(--display)}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border:0;padding:0;margin:0}
.lv{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 9px;min-height:92px;border-radius:18px;border:3px solid var(--line);background:var(--surface-2);color:var(--fg);cursor:pointer;text-align:center}
.lv svg{width:26px;height:26px;color:var(--c)}
.lv .n{font:400 21px/1.2 var(--display)}
.lv .s{font-size:14px;line-height:1.2;color:var(--muted)}
.lv .st{font-size:14px;letter-spacing:2px;line-height:1;color:var(--muted)}
.lv[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--on)}
.lv[aria-pressed="true"] svg,.lv[aria-pressed="true"] .s,.lv[aria-pressed="true"] .st{color:var(--on)}
.q{margin:0;font:400 clamp(23px,2.5vw,27px)/1.6 var(--display);letter-spacing:.03em;text-wrap:pretty}
.thread{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.thread:empty{display:none}
.msg{max-width:94%;padding:12px 16px;border-radius:20px;font-size:20px}
.msg p{margin:0}
.msg .tag{display:block;font-size:14px;color:inherit;opacity:.75;margin-bottom:2px}
.me{margin-left:auto;background:var(--me);color:var(--on-me);border-bottom-right-radius:6px}
.bot{background:var(--surface-2);border-bottom-left-radius:6px}
.bot .tag{color:var(--muted);opacity:1}
.dots{display:inline-flex;gap:6px;padding:6px 2px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.form{display:flex;flex-direction:column;gap:10px}
.form label{font-size:17px;color:var(--muted)}
textarea{width:100%;min-height:88px;resize:vertical;padding:12px 16px;font-size:21px;line-height:1.5;color:var(--fg);background:var(--bg);border:3px solid var(--line);border-radius:18px}
textarea:focus-visible{border-color:var(--lv);outline-color:var(--focus)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.note{margin:0;font-size:16px;line-height:1.5;color:var(--muted)}
.hint{min-height:1.5em}

/* 翻頁列 */
.pager{position:sticky;bottom:0;z-index:5;margin-left:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));margin-right:calc(-1 * max(16px, env(safe-area-inset-right, 0px)));padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));background:var(--bg);border-top:3px solid var(--line)}
.pager-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px}
.pager .btn{min-width:132px;font-family:var(--display);font-weight:400;font-size:22px}
.pages{flex:1;display:flex;justify-content:center;flex-wrap:wrap}
.dot{width:36px;height:44px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center}
.dot::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--line);border:2px solid var(--muted)}
.dot[aria-current="page"]::before{width:20px;height:20px;background:var(--l2);border-color:var(--fg)}

/* 場景與動畫（只在畫面內，不遮住文字，也不會擋住操作） */
.scene [data-fx]{opacity:0;transition:opacity .6s ease;pointer-events:none}
.scene [data-fx].on{opacity:.55}
.scene.fx-rain [data-fx="rain"],.scene.fx-shine [data-fx="shine"],.scene.fx-dim [data-fx="dim"],.scene.fx-sparkle [data-fx="sparkle"],
.scene.fx-knock [data-fx="knock"],.scene.fx-sparks [data-fx="sparks"],.scene.fx-rust [data-fx="rust"],.scene.fx-sun [data-fx="sun"],
.scene.fx-night [data-fx="night"],.scene.fx-eyes [data-fx="eyes"]{opacity:1}
.scene.fx-dim [data-fx="shine"]{opacity:.8}
.rain line{transform:translate(0,var(--y,0px))}
.scene.fx-rain .rain line{animation:fall 1.1s linear infinite}
@keyframes fall{from{transform:translate(0,-60px)}to{transform:translate(-40px,540px)}}
.drops circle{transform:translate(0,0)}
.scene.fx-rain .drops circle{animation:slide 1.6s ease-in infinite}
@keyframes slide{from{transform:translate(0,0)}to{transform:translate(0,46px)}}
.band{transform:translateX(0) skewX(-18deg)}
.scene.fx-shine .band,.scene.fx-dim .band{animation:sweep 1.8s ease-in-out 3}
@keyframes sweep{from{transform:translateX(0) skewX(-18deg)}to{transform:translateX(300px) skewX(-18deg)}}
.tw{transform-box:fill-box;transform-origin:center}
.scene.fx-sparkle .tw{animation:twinkle 1.5s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.25);opacity:.3}50%{transform:scale(1.15);opacity:1}}
.eyeglow{transform-box:fill-box;transform-origin:center}
.scene.fx-eyes .eyeglow{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.8);opacity:1}50%{transform:scale(1.25);opacity:.45}}
.ring{transform-box:fill-box;transform-origin:center;transform:scale(.4);opacity:0}
.scene.fx-knock .ring{animation:ring 1.5s ease-out infinite}
@keyframes ring{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.8);opacity:0}}
.ding{transform-box:fill-box;transform-origin:center}
.scene.fx-knock .ding{animation:ding 1.5s ease-out infinite}
@keyframes ding{0%{transform:translateY(10px);opacity:0}25%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
.spark{transform:translate(0,0)}
.scene.fx-sparks .spark{animation:spark 1.1s ease-out infinite}
@keyframes spark{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
.rays{animation:none}
.scene.fx-sun .rays{animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{opacity:.6}}

@media (max-width:900px){
  .book{grid-template-columns:minmax(0,1fr);gap:26px}
  .bubble::before{left:44px;top:-15px;border-bottom:0;border-top:4px solid var(--lv)}
}
@media (max-width:520px){
  body{font-size:18px}
  .count{font-size:17px;padding:8px 14px}
  .pager .btn{min-width:0;padding:0 16px;font-size:20px}
  .bubble{padding:18px 16px 20px}
  .story{padding:18px 18px}
  .dot{width:30px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .scene.fx-sparkle .tw{transform:scale(.9)}
  .scene.fx-eyes .eyeglow{transform:scale(1)}
  .scene.fx-knock .ring{transform:scale(1.4);opacity:.6}
  .scene.fx-sparks .spark{transform:translate(var(--dx),var(--dy))}
  .scene.fx-shine .band,.scene.fx-dim .band{transform:translateX(150px) skewX(-18deg)}
}
</style>

 for(i=0;i<46;i++){ var x=Math.round(r()*860-30),y=Math.round(r()*470),dl=r().toFixed(2),ln=18+Math.round(r()*16); s+='<line x1="'+x+'" y1="0" x2="'+(x-6)+'" y2="'+ln+'" style="--y:'+y+'px;animation-delay:-'+dl+'s"/>'; }
 return '<g data-fx="rain" class="rain" stroke="#5f9fe0" stroke-width="2.2" stroke-linecap="round" stroke-opacity=".7">'+s+'</g>';
}
function sparkleSVG(){
 var pts=[[560,120],[700,96],[745,206],[610,262],[724,322],[470,150],[335,112],[525,300],[660,66],[600,350]],s='',i;
 for(i=0;i<pts.length;i++){ s+='<g transform="translate('+pts[i][0]+','+pts[i][1]+')"><path class="tw" style="animation-delay:-'+(i*0.17).toFixed(2)+'s" d="M0,-13L3.4,-3.4L13,0L3.4,3.4L0,13L-3.4,3.4L-13,0L-3.4,-3.4Z" fill="#fff7b0" stroke="#f0a81c" stroke-width="1.5"/></g>'; }
 return '<g data-fx="sparkle">'+s+'</g>';
}
function knockSVG(){
 return '<g data-fx="knock"><g fill="none" stroke="#fff" stroke-width="3.5"><circle class="ring" cx="655" cy="290" r="40"/><circle class="ring" cx="655" cy="290" r="40" style="animation-delay:.5s"/><circle class="ring" cx="655" cy="290" r="40" style="animation-delay:1s"/></g>'+
 '<text class="ding" x="716" y="238" font-size="36" fill="#fff" stroke="#3b4a5a" stroke-width="1.6" paint-order="stroke" style="font-family:var(--display)">叮～</text></g>';
}
function sparksSVG(){
 var r=rng(23),s='',i;
 for(i=0;i<14;i++){ var a=r()*Math.PI*2,dist=50+r()*70; s+='<circle class="spark" cx="655" cy="300" r="'+(2+r()*2).toFixed(1)+'" fill="'+(i%2?'#ffb43a':'#ff7a2a')+'" style="--dx:'+Math.round(Math.cos(a)*dist)+'px;--dy:'+Math.round(Math.sin(a)*dist-10)+'px;animation-delay:-'+(r()*1.1).toFixed(2)+'s"/>'; }
 return '<g data-fx="sparks">'+s+'</g>';
}
function sunSVG(){
 return '<g data-fx="sun"><g class="rays"><path d="M520,60 L750,60 L430,445 L170,445 Z" fill="url(#shaftG)" fill-opacity=".5"/><circle cx="630" cy="120" r="110" fill="url(#glowG)" fill-opacity=".5"/></g></g>';
}
function boySVG(b){
 var sk='#f1c7a0',sh='#2a9d8f';
 var A={stand:[[-40,-100],[40,-100]],wow:[[-54,-176],[54,-176]],touch:[[-40,-100],[86,-146]],wave:[[-56,-192],[40,-100]],point:[[-74,-178],[40,-100]],lean:[[-38,-104],[44,-112]]}[b.pose];
 function arm(sx,e){ var mx=sx+(e[0]-sx)*.32,my=-142+(e[1]+142)*.32;
  return '<path d="M'+sx+',-142 L'+e[0]+','+e[1]+'" stroke="'+sk+'" stroke-width="13" stroke-linecap="round"/><circle cx="'+e[0]+'" cy="'+e[1]+'" r="8" fill="'+sk+'"/><path d="M'+sx+',-142 L'+mx.toFixed(1)+','+my.toFixed(1)+'" stroke="'+sh+'" stroke-width="17" stroke-linecap="round"/>'; }
 var wow=b.mood==='wow',lk=b.look||0,er=wow?4.6:3.8;
 var mouth=b.mood==='wow'?'<ellipse cx="0" cy="-153" rx="5" ry="7" fill="#7a2e2e"/>':(b.mood==='calm'?'<path d="M-6,-154H6" stroke="#7a2e2e" stroke-width="2.6" stroke-linecap="round"/>':'<path d="M-9,-156 Q0,-148 9,-156" fill="none" stroke="#7a2e2e" stroke-width="2.6" stroke-linecap="round"/>');
 var brows=wow?'<path d="M-19,-186 Q-12,-192 -5,-186M5,-186 Q12,-192 19,-186" fill="none" stroke="#2a211d" stroke-width="2.4" stroke-linecap="round"/>':'';
 return '<g transform="translate('+b.x+',445)">'+
 '<rect x="-23" y="-74" width="16" height="66" rx="6" fill="'+sk+'"/><rect x="7" y="-74" width="16" height="66" rx="6" fill="'+sk+'"/>'+
 '<ellipse cx="-15" cy="-6" rx="16" ry="8" fill="#3b4252"/><ellipse cx="15" cy="-6" rx="16" ry="8" fill="#3b4252"/>'+
 '<rect x="-28" y="-100" width="56" height="36" rx="10" fill="#4a5f8a"/>'+
 arm(-26,A[0])+arm(26,A[1])+
 '<rect x="-28" y="-152" width="56" height="60" rx="16" fill="'+sh+'"/><path d="M-28,-124H28" stroke="#fff" stroke-opacity=".35" stroke-width="5"/>'+
 '<g transform="rotate('+(b.tilt||0)+' 0 -140)">'+
 '<rect x="-7" y="-152" width="14" height="14" fill="'+sk+'"/><circle cx="0" cy="-172" r="34" fill="'+sk+'"/>'+
 '<circle cx="-34" cy="-170" r="6" fill="'+sk+'"/><circle cx="34" cy="-170" r="6" fill="'+sk+'"/>'+
 '<path d="M-35,-174 C-36,-212 36,-212 35,-174 C20,-188 -20,-188 -35,-174 Z" fill="#2a211d"/>'+
 '<circle cx="'+(-12+lk)+'" cy="-170" r="'+er+'" fill="#1b1b1b"/><circle cx="'+(12+lk)+'" cy="-170" r="'+er+'" fill="#1b1b1b"/>'+
 '<circle cx="'+(-10.5+lk)+'" cy="-171.5" r="1.4" fill="#fff"/><circle cx="'+(13.5+lk)+'" cy="-171.5" r="1.4" fill="#fff"/>'+
 '<circle cx="-22" cy="-160" r="6" fill="#f08a8a" fill-opacity=".45"/><circle cx="22" cy="-160" r="6" fill="#f08a8a" fill-opacity=".45"/>'+
 brows+mouth+'</g></g>';
}
function artistSVG(x){
 var sk='#d7a07a',cl='#e4572e';
 return '<g transform="translate('+x+',445) scale(1.1)">'+
 '<ellipse cx="-14" cy="-5" rx="16" ry="7" fill="#2b2b3a"/><ellipse cx="14" cy="-5" rx="16" ry="7" fill="#2b2b3a"/>'+
 '<rect x="-21" y="-100" width="16" height="94" rx="5" fill="#3c3a4a"/><rect x="5" y="-100" width="16" height="94" rx="5" fill="#3c3a4a"/>'+
 '<path d="M-28,-160 L-43,-112" stroke="'+cl+'" stroke-width="15" stroke-linecap="round"/><circle cx="-44" cy="-106" r="8" fill="'+sk+'"/>'+

 '<path d="M-34,-92 L-30,-170 Q0,-182 30,-170 L34,-92 Z" fill="'+cl+'"/>'+
 '<circle cx="-14" cy="-140" r="4" fill="#f0a81c"/><circle cx="12" cy="-122" r="4" fill="#3f6fb5"/><circle cx="-6" cy="-108" r="3.4" fill="#2a9d8f"/><rect x="-14" y="-118" width="28" height="18" rx="4" fill="#000" fill-opacity=".12"/>'+
 '<rect x="-7" y="-176" width="14" height="14" fill="'+sk+'"/><circle cx="0" cy="-198" r="30" fill="'+sk+'"/>'+
 '<path d="M-31,-200 C-32,-240 32,-240 31,-200 C20,-216 -20,-216 -31,-200 Z" fill="#2d2638"/><circle cx="0" cy="-236" r="13" fill="#2d2638"/>'+
 '<circle cx="-11" cy="-198" r="7.5" fill="none" stroke="#2d2638" stroke-width="2"/><circle cx="11" cy="-198" r="7.5" fill="none" stroke="#2d2638" stroke-width="2"/><path d="M-3.5,-198H3.5" stroke="#2d2638" stroke-width="2"/>'+
 '<circle cx="-11" cy="-198" r="2.6" fill="#1b1b1b"/><circle cx="11" cy="-198" r="2.6" fill="#1b1b1b"/>'+
 '<path d="M-9,-184 Q0,-176 9,-184" fill="none" stroke="#7a2e2e" stroke-width="2.4" stroke-linecap="round"/></g>';
}
function sceneSVG(p){
 var T=TIMES[p.time];
 return '<defs>'+defs(T)+'</defs>'+roomSVG(p,T)+(p.shadow?shadowSVG():'')+(p.artist?artistSVG(100):'')+boySVG(p.boy)+
 '<rect data-fx="dim" width="800" height="480" fill="#0a1020" fill-opacity=".62"/>'+
 '<rect data-fx="night" width="800" height="480" fill="#0f1a3c" fill-opacity=".45"/>'+
 '<ellipse data-fx="dim" cx="655" cy="262" rx="210" ry="190" fill="url(#glowG)" fill-opacity=".5"/>'+
 (p.cloth?clothSVG():catSVG(p))+rainSVG()+sparkleSVG()+knockSVG()+sparksSVG()+sunSVG();
}

/* ---------- 狀態與畫面 ---------- */
var state={page:0,level:1,threads:{},generic:0,typing:false};
var scene=$('#scene'),ta=$('#ans'),hintEl=$('#hint'),fxTimer=null,dict=null,dictOn=false,dictBase='';

function hint(t){ hintEl.textContent=t||''; }
function clearFx(){ FX_LIST.forEach(function(n){ scene.classList.remove('fx-'+n); }); $('#fxLine').textContent=''; }
function triggerFx(list){
 if(!list.length) return;
 FX_LIST.forEach(function(n){ scene.classList.remove('fx-'+n); });
 void scene.getBoundingClientRect();
 list.forEach(function(n){ scene.classList.add('fx-'+n); });
 var line=$('#fxLine'); line.innerHTML=''; var b=document.createElement('b'); b.textContent='畫面變化：'; line.appendChild(b);
 line.appendChild(document.createTextNode(list.map(function(n){return FX_NAMES[n];}).join('、')));
 clearTimeout(fxTimer); fxTimer=setTimeout(clearFx,9000);
}
function stopVoice(){ try{ if('speechSynthesis' in window) window.speechSynthesis.cancel(); }catch(e){} $('#readBtn').classList.remove('on'); $('#readLabel').textContent='唸給我聽'; if(dict&&dictOn){ try{ dict.stop(); }catch(e){} } }

function renderThread(){
 var ul=$('#thread'); ul.innerHTML='';
 (state.threads[state.page]||[]).forEach(function(m){
  var li=document.createElement('li'); li.className='msg '+(m.who==='me'?'me':'bot');
  var tag=document.createElement('span'); tag.className='tag'; tag.textContent=m.who==='me'?m.tag:'小幫手'; li.appendChild(tag);
  var p=document.createElement('p'); p.textContent=m.text; li.appendChild(p); ul.appendChild(li);
 });
 if(state.typing){ var li2=document.createElement('li'); li2.className='msg bot'; li2.setAttribute('aria-label','小幫手正在想'); li2.innerHTML='<span class="dots"><i></i><i></i><i></i></span>'; ul.appendChild(li2); }
}
function renderLevel(){
 var L=LEVELS[state.level],bub=$('#bubble');
 bub.style.setProperty('--lv','var('+L.c+')'); bub.style.setProperty('--on-lv','var('+L.on+')');
 var btns=document.querySelectorAll('.lv'),i;
 for(i=0;i<btns.length;i++){ btns[i].setAttribute('aria-pressed',String(Number(btns[i].getAttribute('data-level'))===state.level)); }
 $('#qText').textContent=PAGES[state.page].q[state.level];
}
function render(){
 var p=PAGES[state.page];
 stopVoice(); clearTimeout(fxTimer); state.typing=false;
 scene.setAttribute('class','scene'); scene.setAttribute('aria-label',p.alt); scene.innerHTML=sceneSVG(p);
 $('#fxLine').textContent='';
 $('#storyText').textContent=p.text;
 $('#pageNow').textContent=state.page+1; $('#pageAll').textContent=PAGES.length;
 $('#prevBtn').disabled=state.page===0;
 $('#nextLabel').textContent=state.page===PAGES.length-1?'再讀一次':'下一頁';
 var dots=document.querySelectorAll('.dot'),i;
 for(i=0;i<dots.length;i++){ if(i===state.page) dots[i].setAttribute('aria-current','page'); else dots[i].removeAttribute('aria-current'); }
 hint(''); renderLevel(); renderThread();
}
function go(n){ if(n<0||n>=PAGES.length) return; state.page=n; render(); window.scrollTo({top:0,behavior:'auto'}); }

/* ---------- 事件 ---------- */
(function build(){
 var box=$('#pages'),i;
 for(i=0;i<PAGES.length;i++){ (function(n){ var b=document.createElement('button'); b.type='button'; b.className='dot'; b.setAttribute('aria-label','前往第'+(n+1)+'頁'); b.addEventListener('click',function(){go(n);}); box.appendChild(b); })(i); }
})();
$('#prevBtn').addEventListener('click',function(){ go(state.page-1); });
$('#nextBtn').addEventListener('click',function(){ go(state.page===PAGES.length-1?0:state.page+1); });
document.querySelectorAll('.lv').forEach(function(b){ b.addEventListener('click',function(){ state.level=Number(b.getAttribute('data-level')); renderLevel(); }); });
document.addEventListener('keydown',function(e){
 if(e.target&&(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')) return;
 if(e.key==='ArrowRight') go(Math.min(state.page+1,PAGES.length-1));
 if(e.key==='ArrowLeft') go(Math.max(state.page-1,0));
});
ta.addEventListener('keydown',function(e){
 if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){ e.preventDefault(); $('#ansForm').requestSubmit(); }
});
$('#ansForm').addEventListener('submit',function(e){
 e.preventDefault();
 var text=ta.value.trim();
 if(!text){ hint('想到什麼都可以寫下來，也可以直接翻頁喔。'); return; }
 if(dictOn&&dict){ try{ dict.stop(); }catch(err){} }
 var pg=state.page; if(!state.threads[pg]) state.threads[pg]=[];
 state.threads[pg].push({who:'me',tag:LEVELS[state.level].name,text:text});
 ta.value=''; dictBase=''; hint('');
 var res=respond(text); triggerFx(res.fx);
 state.typing=true; renderThread();
 setTimeout(function(){
  if(state.page!==pg) return;
  state.typing=false; state.threads[pg].push({who:'bot',text:res.say}); renderThread();
 },550);
});
$('#readBtn').addEventListener('click',function(){
 try{
  var ss=window.speechSynthesis;
  if(ss.speaking){ ss.cancel(); $('#readBtn').classList.remove('on'); $('#readLabel').textContent='唸給我聽'; return; }
  var u=new SpeechSynthesisUtterance(PAGES[state.page].text); u.lang='zh-TW'; u.rate=.9;
  u.onend=u.onerror=function(){ $('#readBtn').classList.remove('on'); $('#readLabel').textContent='唸給我聽'; };
  $('#readBtn').classList.add('on'); $('#readLabel').textContent='停止';
  ss.speak(u);
 }catch(err){ hint('這個瀏覽器暫時不能唸故事。'); }
});
if(!('speechSynthesis' in window)) $('#readBtn').hidden=true;

/* 語音輸入：只有取得 dictation 能力時才顯示麥克風 */
(async function initDict(){
 try{
  if(!(window.claude&&window.claude.use)) return;
  var d=await window.claude.use('dictation'); if(!d) return;
  dict=d; $('#micBtn').hidden=false;
  d.onPartial(function(r){ ta.value=dictBase+r.text; });
  d.onFinal(function(r){ dictBase=dictBase+r.text; ta.value=dictBase; });
  d.onState(function(s){
   dictOn=s.state==='listening';
   $('#micBtn').classList.toggle('on',dictOn); $('#micBtn').setAttribute('aria-pressed',String(dictOn));
   $('#micLabel').textContent=dictOn?'說完了':'說說看';
   hint(dictOn?'我在聽，說完請再按一次。':'');
  });
 }catch(err){ dict=null; }
})();
$('#micBtn').addEventListener('click',function(){
 if(!dict) return;
 if(dictOn){ dict.stop().catch(function(){}); return; }
 dictBase=ta.value;
 dict.start().catch(function(err){
  var c=err&&err.code;
  hint(c==='not_granted'?'麥克風沒有打開，也可以用打字回答喔。':'再按一次麥克風試試看，或用打字回答。');
 });
});

render();
})();
</script>

</body></html>
